    <rect x="124" y="244" width="34" height="150"/><rect x="190" y="244" width="34" height="150"/>
    <rect x="288" y="244" width="34" height="150"/><rect x="354" y="244" width="34" height="150"/>
  </g>
  <rect x="96" y="394" width="320" height="28" fill="#f3ead2"/>
  <rect x="80" y="422" width="352" height="26" fill="#ddd2b6"/>
  <!-- Fulmine di Zeus -->
  <polygon points="276,150 214,300 256,300 230,410 314,252 268,252 300,150" fill="#ffe14d" stroke="#b37400" stroke-width="8" stroke-linejoin="round"/>
