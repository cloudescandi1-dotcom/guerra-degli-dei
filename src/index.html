<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Guerra degli Dèi</title>
  <meta name="description" content="Battaglie di carte in tempo reale con eroi e mostri della mitologia greca e romana.">
  <meta name="theme-color" content="#12295e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guerra Dèi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Menu principale -->
  <section id="home" class="screen">
    <header class="top">
      <button id="btn-profile" class="profile" type="button">
        <span class="lvl-shield"><b id="top-level">1</b></span>
        <span class="pname"><b id="top-name">Eroe</b><span class="tro">🏆 <span id="top-trophies">0</span></span></span>
      </button>
      <div class="top-right">
        <button class="res" type="button" data-go="negozio"><span class="ico">🪙</span><b id="top-gold">0</b><i>+</i></button>
        <button class="res gems" type="button" data-go="negozio"><span class="ico">💎</span><b id="top-gems">0</b><i>+</i></button>
        <button id="btn-settings" class="icon-btn" type="button" title="Impostazioni">☰<span id="net-dot" class="net-dot" title="Collegamento amici"></span></button>
      </div>
    </header>

    <main class="tabs">
      <div id="tab-negozio" class="tab"></div>
      <div id="tab-carte" class="tab"></div>
      <div id="tab-battaglia" class="tab active"></div>
      <div id="tab-clan" class="tab"></div>
      <div id="tab-eventi" class="tab"></div>
    </main>

    <nav class="tabbar">
      <button data-tab="negozio" type="button"><span class="ti"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tb-st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9aa6b5"/></linearGradient><linearGradient id="tb-gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#e5a21c"/></linearGradient></defs><path d="M6 18 L24 8 L42 18 Z" fill="url(#tb-gd)" stroke="#0f1b3a" stroke-width="2.4" stroke-linejoin="round"/><rect x="9" y="18" width="30" height="20" rx="2" fill="#c0392b" stroke="#0f1b3a" stroke-width="2.4"/><path d="M9 18 h30" stroke="#ffe680" stroke-width="3"/><rect x="19" y="26" width="10" height="12" fill="#5a3418" stroke="#0f1b3a" stroke-width="2"/><circle cx="24" cy="14" r="2.6" fill="#fff"/></svg></span><em>Negozio</em></button>
      <button data-tab="carte" type="button"><span class="ti"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tb-st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9aa6b5"/></linearGradient><linearGradient id="tb-gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#e5a21c"/></linearGradient></defs><rect x="8" y="10" width="20" height="28" rx="3" fill="#8b5cf6" stroke="#0f1b3a" stroke-width="2.4" transform="rotate(-12 18 24)"/><rect x="18" y="8" width="22" height="30" rx="3" fill="#3f8ff0" stroke="#0f1b3a" stroke-width="2.4" transform="rotate(8 29 23)"/><circle cx="29" cy="20" r="5" fill="url(#tb-gd)" stroke="#0f1b3a" stroke-width="1.8" transform="rotate(8 29 23)"/></svg></span><em>Carte</em></button>
      <button data-tab="battaglia" type="button" class="active"><span class="ti"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tb-st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9aa6b5"/></linearGradient><linearGradient id="tb-gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#e5a21c"/></linearGradient></defs><path d="M10 8 L34 34 M38 8 L14 34" stroke="#0f1b3a" stroke-width="7" stroke-linecap="round"/><path d="M10 8 L34 34 M38 8 L14 34" stroke="url(#tb-st)" stroke-width="4" stroke-linecap="round"/><path d="M28 36 L36 28 M20 36 L12 28" stroke="#0f1b3a" stroke-width="7" stroke-linecap="round"/><path d="M28 36 L36 28 M20 36 L12 28" stroke="url(#tb-gd)" stroke-width="4" stroke-linecap="round"/><circle cx="38" cy="38" r="3.6" fill="url(#tb-gd)" stroke="#0f1b3a" stroke-width="1.8"/><circle cx="10" cy="38" r="3.6" fill="url(#tb-gd)" stroke="#0f1b3a" stroke-width="1.8"/></svg></span><em>Battaglia</em></button>
      <button data-tab="clan" type="button"><span class="ti"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="tb-st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9aa6b5"/></linearGradient><linearGradient id="tb-gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#e5a21c"/></linearGradient></defs><path d="M24 5 L40 11 V24 Q40 37 24 44 Q8 37 8 24 V11 Z" fill="url(#tb-gd)" stroke="#0f1b3a" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 10 L35 14 V24 Q35 33 24 39 Q13 33 13 24 V14 Z" fill="#c0392b"/><path d="M24 14 L27 22 H35 L28.5 27 L31 35 L24 30 L17 35 L19.5 27 L13 22 H21 Z" fill="#fff" stroke="#0f1b3a" stroke-width="1.2"/></svg></span><em>Clan</em><i id="clan-badge" class="badge" hidden></i></button>
      <button data-tab="eventi" type="button"><span class="ti"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 6 H34 V16 Q34 28 24 30 Q14 28 14 16 Z" fill="url(#tb-gd)" stroke="#0f1b3a" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 10 H7 Q7 20 15 21 M34 10 H41 Q41 20 33 21" fill="none" stroke="#0f1b3a" stroke-width="2.4"/><rect x="21" y="30" width="6" height="6" fill="url(#tb-gd)" stroke="#0f1b3a" stroke-width="2"/><rect x="14" y="36" width="20" height="6" rx="2" fill="#c0392b" stroke="#0f1b3a" stroke-width="2.4"/><path d="M24 11 l2 4 4 .5 -3 3 .8 4 -3.8 -2 -3.8 2 .8 -4 -3 -3 4 -.5 Z" fill="#fff"/></svg></span><em>Eventi</em></button>
    </nav>
  </section>

  <!-- Battaglia -->
  <section id="battle" class="screen" hidden>
    <div class="hud-top">
      <div class="foe"><span class="lvl-shield red"><b id="foe-level">1</b></span><span class="foe-txt"><b id="foe-name">Avversario</b><small id="foe-sub"></small></span></div>
      <button id="btn-emote" class="icon-btn small" type="button" title="Emoticon">😀</button>
    </div>
    <div class="field" id="field">
      <canvas id="canvas"></canvas>
      <!-- Corone e tempo al centro, sopra il fiume -->
      <div id="river-hud" class="river-hud">
        <span id="foe-crowns" class="crowns red">👑 0</span>
        <div class="clock"><small id="clock-label">Tempo</small><b id="clock">3:00</b></div>
        <span id="my-crowns" class="crowns blue">👑 0</span>
      </div>
      <div id="countdown" class="countdown" hidden></div>
      <div id="banner" class="banner" hidden></div>
      <div id="emote-bar" class="emote-bar" hidden></div>
      <div id="emote-foe" class="emote-bubble foe-bubble" hidden></div>
      <div id="emote-me" class="emote-bubble me-bubble" hidden></div>
    </div>
    <div class="hud-bottom">
      <div class="hand">
        <div class="next"><small>Prossima</small><div id="next-card" class="mini-card"></div></div>
        <div id="hand" class="hand-cards"></div>
      </div>
      <div class="amb">
        <span class="drop" id="amb-num">5</span>
        <div class="amb-bar"><div id="amb-fill"></div><div class="ticks"></div></div>
      </div>
    </div>
  </section>

  <!-- Cammino degli Eroi (ricompense delle coppe e arene) -->
  <section id="road" class="screen road-screen" hidden>
    <div class="road-head"><h3>Cammino degli Eroi</h3><button id="road-close" class="close-x" type="button" aria-label="Chiudi">✕</button></div>
    <div id="road-list" class="road-list"></div>
  </section>

  <!-- Finestra generica (contenuto creato dal codice) -->
  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="close" type="button" aria-label="Chiudi">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/cards.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/render.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/peerjs.min.js"></script>
  <script src="js/social.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
