<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Prova 3D · Guerra degli Dèi</title>
  <meta name="theme-color" content="#12295e">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #12295e; overflow: hidden; font-family: "Nunito", system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .tag {
      position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%);
      padding: 6px 14px; border-radius: 10px; background: #0b1a40cc; border: 2px solid #0d2150;
      font-family: "Lilita One", sans-serif; font-size: 1.1rem; text-shadow: 0 2px 0 #0008; white-space: nowrap;
    }
    .bar { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; padding: 0 12px; flex-wrap: wrap; }
    .bar button {
      font-family: "Lilita One", sans-serif; font-size: 1rem; color: #fff; text-shadow: 0 2px 0 #0008;
      padding: 10px 14px; border-radius: 12px; border: 2px solid #0d2150; background: linear-gradient(#8fd0ff, #2c86e8); box-shadow: inset 0 3px 0 #fff6, 0 3px 0 #0b1b42;
    }
    .bar button.on { background: linear-gradient(#ffe680, #f29b00); }
  </style>
</head>
<body>
  <div class="tag">Prova 3D · versione 2</div>
  <div class="bar">
    <button id="b-restart" type="button">Ricomincia</button>
    <button id="b-slow" type="button">Al rallentatore</button>
    <button id="b-cam" type="button">Vetrina</button>
  </div>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ---------------------------------------------------------------- scena e luci (calde e morbide)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(3, window.devicePixelRatio || 1));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#6fb3ef');
    // riflessi morbidi su tutte le superfici (plastica lucida)
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const W = 18, H = 32;
    const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 200);
    let showcase = false;
    function placeCamera() {
      if (showcase) { const far = camera.aspect < 0.8 ? 20 : 10; camera.position.set(0.8, 3 + far * 0.15, far); camera.lookAt(0.8, 1.2, 0); }
      else { camera.position.set(0, 44, 24); camera.lookAt(0, 0, 2.2); }    // molto dall'alto, come Clash
    }

    scene.add(new THREE.HemisphereLight('#fff6e6', '#5c7a3a', 0.9));
    const sun = new THREE.DirectionalLight('#fff1d6', 2.6);
    sun.position.set(-8, 22, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 20, bottom: -20, near: 1, far: 70 });
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
    scene.add(sun);
    const rim = new THREE.DirectionalLight('#bfe2ff', 1.1);     // luce di contorno da dietro
    rim.position.set(6, 8, -14); scene.add(rim);

    const mats = {};
    // plastica liscia e un po' lucida; metallo per oro e bronzo
    function mat(color, o = {}) {
      const k = color + JSON.stringify(o);
      return mats[k] || (mats[k] = new THREE.MeshStandardMaterial({ color, roughness: o.r ?? 0.55, metalness: o.m ?? 0, envMapIntensity: o.env ?? 0.6 }));
    }
    const GOLD = () => mat('#f2b632', { r: 0.28, m: 0.85, env: 1.2 });
    const BRONZE = () => mat('#d08a3a', { r: 0.32, m: 0.8, env: 1.1 });
    const STEEL = () => mat('#cfd8e3', { r: 0.25, m: 0.9, env: 1.3 });
    function mesh(geo, material, x = 0, y = 0, z = 0) {
      const m = new THREE.Mesh(geo, material);
      m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
      return m;
    }
    const sph = (r, seg = 28) => new THREE.SphereGeometry(r, seg, Math.round(seg * 0.75));
    const cap = (r, l) => new THREE.CapsuleGeometry(r, l, 8, 18);
    const rbox = (w, h, d, r = 0.08) => new RoundedBoxGeometry(w, h, d, 4, r);

    // ---------------------------------------------------------------- campo
    function fieldTexture() {
      const c = document.createElement('canvas'); c.width = 18 * 40; c.height = 32 * 40;
      const g = c.getContext('2d');
      g.fillStyle = '#7dbb3f'; g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = '#74b23a';
      for (let y = 0; y < 32; y++) for (let x = y % 2; x < 18; x += 2) g.fillRect(x * 40, y * 40, 40, 40);
      g.fillStyle = '#e2c98f';
      for (const x of [3.5, 14.5]) g.fillRect((x - 0.9) * 40, 1.5 * 40, 1.8 * 40, 29 * 40);
      for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${Math.random() < 0.5 ? '255,255,200' : '40,90,20'},${0.08 + Math.random() * 0.12})`; g.fillRect(Math.random() * c.width, Math.random() * c.height, 2, 4); }
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
      return t;
    }
    const side = mat('#6a9a34');
    const ground = new THREE.Mesh(new THREE.BoxGeometry(W, 0.8, H), [side, side, new THREE.MeshStandardMaterial({ map: fieldTexture(), roughness: 0.9 }), side, side, side]);
    ground.position.y = -0.4; ground.receiveShadow = true; scene.add(ground);
    scene.add(mesh(new THREE.BoxGeometry(W + 0.4, 0.5, 2), new THREE.MeshStandardMaterial({ color: '#3fa9f0', roughness: 0.15, metalness: 0.1, envMapIntensity: 1.5 }), 0, -0.2, 0));
    for (const x of [-5.5, 5.5]) {
      scene.add(mesh(rbox(2.6, 0.4, 3.2, 0.12), mat('#e9dcc2'), x, 0.1, 0));
      for (const s of [-1.15, 1.15]) scene.add(mesh(rbox(0.25, 0.55, 3.2, 0.1), mat('#f6efe0'), x + s, 0.45, 0));
    }
    // muro di cinta e gradinate con il pubblico
    const stone = mat('#cdb88f', { r: 0.8 });
    for (const sx of [-1, 1]) scene.add(mesh(rbox(0.8, 1.2, H + 1.6, 0.15), stone, sx * (W / 2 + 0.4), 0.1, 0));
    for (const sz of [-1, 1]) scene.add(mesh(rbox(W + 1.6, 1.2, 0.8, 0.15), stone, 0, 0.1, sz * (H / 2 + 0.4)));
    const crowd = [];
    const shirt = ['#e0453a', '#3f7fe0', '#f2c24a', '#7ab84a', '#ffffff', '#b46cf5', '#ff8fb8'];
    const crowdBody = cap(0.22, 0.2), crowdHead = sph(0.22, 14);
    for (let row = 0; row < 4; row++) {
      for (const sx of [-1, 1]) {
        scene.add(mesh(new THREE.BoxGeometry(1.4, 1 + row * 0.9, H + 6), mat('#b9a27a', { r: 0.85 }), sx * (W / 2 + 1.6 + row * 1.4), (1 + row * 0.9) / 2 - 0.4, 0));
        for (let z = -H / 2 - 2; z < H / 2 + 2; z += 0.9) {
          if (Math.random() < 0.2) continue;
          const g = new THREE.Group();
          g.add(mesh(crowdBody, mat(shirt[(Math.random() * shirt.length) | 0]), 0, 0.25, 0));
          g.add(mesh(crowdHead, mat('#f0b98c'), 0, 0.72, 0));
          g.position.set(sx * (W / 2 + 1.6 + row * 1.4) + (Math.random() - 0.5) * 0.3, 0.6 + row * 0.9, z);
          g.userData = { y: g.position.y, jump: Math.random() * 6 };
          scene.add(g); crowd.push(g);
        }
      }
    }

    // ---------------------------------------------------------------- personaggi "chibi"
    // Testa enorme, corpo piccolo, mani e piedi grossi: le proporzioni dei personaggi dei giochi di carte per telefono.
    const TEAM = { blue: { c: '#3d86f0', d: '#1f56b8' }, red: { c: '#ec4a3c', d: '#a8261c' } };
    const SKIN = '#f6c39a';
    function face(head, o = {}) {
      const R = 0.62;
      if (o.cyclops) {
        const eye = new THREE.Group(); eye.position.set(0, 0.08, R * 0.88);
        eye.add(mesh(sph(0.26, 24), mat('#ffffff', { r: 0.2 })));
        eye.add(mesh(sph(0.15, 18), mat('#e0a020', { r: 0.2 }), 0, 0, 0.15));
        eye.add(mesh(sph(0.08, 12), mat('#1a1030'), 0, 0, 0.23));
        eye.add(mesh(sph(0.035, 8), mat('#ffffff'), 0.05, 0.06, 0.27));
        head.add(eye);
        const brow = mesh(cap(0.08, 0.45), mat('#3d2a12'), 0, 0.36, R * 0.8); brow.rotation.z = Math.PI / 2 - 0.1; head.add(brow);
      } else {
        for (const s of [-1, 1]) {
          // occhio: bianco, iride, pupilla e riflesso
          const eye = new THREE.Group(); eye.position.set(s * 0.22, 0.04, R * 0.86); eye.rotation.y = s * 0.25;
          eye.add(mesh(sph(0.13, 20), mat('#ffffff', { r: 0.2 })));
          eye.add(mesh(sph(0.08, 16), mat(o.iris || '#3d7fd8', { r: 0.2 }), 0, 0, 0.075));
          eye.add(mesh(sph(0.045, 12), mat('#1a1030'), 0, 0, 0.115));
          eye.add(mesh(sph(0.025, 8), mat('#ffffff', { r: 0.1 }), 0.03, 0.04, 0.15));
          head.add(eye);
          // sopracciglia spesse (arrabbiate se serve)
          const brow = mesh(cap(0.05, 0.2), mat(o.brow || '#5a3418'), s * 0.22, 0.24, R * 0.88);
          brow.rotation.z = Math.PI / 2 + s * (o.angry ? -0.35 : 0.1); head.add(brow);
        }
      }
      if (!o.noNose) head.add(mesh(sph(0.1, 14), mat(o.skin || SKIN), 0, -0.1, R * 0.98));
      const mouth = mesh(new THREE.TorusGeometry(0.1, 0.03, 8, 16, Math.PI), mat('#7a2a20'), 0, -0.28, R * 0.9);
      mouth.rotation.z = o.angry ? 0 : Math.PI; head.add(mouth);
    }
    function chibi({ team, body = TEAM[team].c, skin = SKIN, scale = 1, legs = skin, girth = 1, faceOpts = {} } = {}) {
      const root = new THREE.Group();
      const rig = new THREE.Group(); root.add(rig);
      const hips = new THREE.Group(); hips.position.y = 0.5; rig.add(hips);
      const leg = (s) => {
        const p = new THREE.Group(); p.position.set(s * 0.2 * girth, 0, 0); hips.add(p);
        p.add(mesh(cap(0.12, 0.18), mat(legs), 0, -0.2, 0));
        p.add(mesh(rbox(0.3, 0.18, 0.42, 0.08), mat('#7a4520'), 0, -0.42, 0.06));   // sandalo grosso
        return p;
      };
      const legL = leg(-1), legR = leg(1);
      const torso = new THREE.Group(); hips.add(torso);
      const belly = mesh(sph(0.42 * girth, 28), mat(body), 0, 0.32, 0); belly.scale.set(1, 1.05, 0.9); torso.add(belly);
      const arm = (s) => {
        const p = new THREE.Group(); p.position.set(s * 0.44 * girth, 0.5, 0); torso.add(p);
        p.add(mesh(cap(0.1, 0.22), mat(skin), 0, -0.18, 0));
        p.add(mesh(sph(0.16, 18), mat(skin), 0, -0.42, 0));          // manone
        const hand = new THREE.Group(); hand.position.y = -0.42; p.add(hand);
        p.userData.hand = hand;
        return p;
      };
      const armL = arm(-1), armR = arm(1);
      const head = new THREE.Group(); head.position.y = 1.15; torso.add(head);
      head.add(mesh(sph(0.62, 36), mat(skin, { r: 0.6 })));
      for (const s of [-1, 1]) head.add(mesh(sph(0.13, 14), mat(skin), s * 0.6, -0.02, 0));   // orecchie
      face(head, { skin, ...faceOpts });
      root.scale.setScalar(scale);
      return { root, rig, hips, torso, head, legL, legR, armL, armR };
    }

    function makeOplita(team) {
      const h = chibi({ team, faceOpts: { angry: true } });
      // elmo corinzio di bronzo con paraguance, che lascia scoperta la faccia, e cresta della squadra
      const helm = mesh(sph(0.68, 36), BRONZE()); helm.scale.set(1, 0.75, 1); helm.position.y = 0.2; h.head.add(helm);
      for (const s of [-1, 1]) h.head.add(mesh(rbox(0.18, 0.55, 0.5, 0.08), BRONZE(), s * 0.58, -0.15, 0.12));
      const crest = new THREE.Group(); crest.position.set(0, 0.72, -0.05); h.head.add(crest);
      crest.add(mesh(rbox(0.16, 0.18, 0.6, 0.05), GOLD(), 0, -0.05, 0));
      for (let i = 0; i < 7; i++) { const f = mesh(cap(0.1, 0.3), mat(TEAM[team].c), 0, 0.15 + Math.sin(i / 6 * Math.PI) * 0.12, -0.45 + i * 0.16); f.rotation.x = -0.6 + i * 0.2; crest.add(f); }
      // corazza di bronzo e gonnellino della squadra
      const cuirass = mesh(sph(0.45, 28), BRONZE(), 0, 0.36, 0.02); cuirass.scale.set(1, 1, 0.9); h.torso.add(cuirass);
      h.torso.add(mesh(new THREE.CylinderGeometry(0.47, 0.52, 0.22, 24), mat(TEAM[team].c), 0, 0.02, 0));
      // scudo grande con la lambda
      const sh = new THREE.Group(); sh.position.set(-0.08, 0, 0.3); h.armL.userData.hand.add(sh);
      const disc = mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.12, 36), BRONZE()); disc.rotation.x = Math.PI / 2; sh.add(disc);
      const inner = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.13, 36), mat(TEAM[team].c, { r: 0.4 })); inner.rotation.x = Math.PI / 2; sh.add(inner);
      for (const s of [-1, 1]) { const l = mesh(cap(0.05, 0.5), mat('#fff6e0'), s * 0.13, -0.02, 0.08); l.rotation.z = s * 0.45; sh.add(l); }
      // lancia
      const spear = new THREE.Group(); h.armR.userData.hand.add(spear); spear.rotation.x = Math.PI / 2.3;
      spear.add(mesh(new THREE.CylinderGeometry(0.045, 0.045, 2.6, 10), mat('#a0683a'), 0, 0.4, 0));
      spear.add(mesh(new THREE.ConeGeometry(0.12, 0.4, 12), STEEL(), 0, 1.9, 0));
      return h;
    }
    function makeArciere(team) {
      const h = chibi({ team, body: '#f6f0e2' });
      h.torso.add(mesh(new THREE.CylinderGeometry(0.47, 0.5, 0.18, 24), mat(TEAM[team].c), 0, 0.05, 0));
      const band = mesh(new THREE.TorusGeometry(0.6, 0.07, 10, 36), mat(TEAM[team].c)); band.rotation.x = Math.PI / 2; band.position.y = 0.22; h.head.add(band);
      for (let i = 0; i < 9; i++) { const a = (i / 9) * Math.PI * 2; h.head.add(mesh(sph(0.2, 14), mat('#5a3418'), Math.cos(a) * 0.45, 0.44, Math.sin(a) * 0.45 - 0.08)); }
      const bow = mesh(new THREE.TorusGeometry(0.7, 0.05, 8, 24, Math.PI * 1.1), mat('#9a5a2a')); bow.rotation.set(0, Math.PI / 2, Math.PI / 2 - 0.15); h.armL.userData.hand.add(bow);
      const quiver = mesh(cap(0.14, 0.5), mat('#8a5228'), 0.2, 0.55, -0.42); quiver.rotation.z = 0.35; h.torso.add(quiver);
      return h;
    }
    function makeCiclope(team) {
      const h = chibi({ team, skin: '#a7dd7f', legs: '#8cc566', girth: 1.35, scale: 1.75, faceOpts: { cyclops: true, angry: true, noNose: true } });
      h.torso.add(mesh(new THREE.CylinderGeometry(0.62, 0.68, 0.36, 24), mat('#8a5228', { r: 0.9 }), 0, 0.02, 0));
      const strap = mesh(new THREE.TorusGeometry(0.5, 0.06, 8, 24), mat(TEAM[team].c)); strap.rotation.set(0.2, 0, 0.8); strap.position.y = 0.4; h.torso.add(strap);
      for (const s of [-1, 1]) { const t = mesh(new THREE.ConeGeometry(0.06, 0.16, 8), mat('#fffbe8'), s * 0.12, -0.24, 0.6); t.rotation.x = Math.PI; h.head.add(t); }
      const club = new THREE.Group(); h.armR.userData.hand.add(club); club.rotation.x = Math.PI / 2.4;
      club.add(mesh(new THREE.CylinderGeometry(0.25, 0.1, 1.5, 14), mat('#8a5228', { r: 0.85 }), 0, 0.6, 0));
      for (let i = 0; i < 4; i++) club.add(mesh(new THREE.ConeGeometry(0.06, 0.18, 8), mat('#d9d0c0'), Math.cos(i * 1.6) * 0.22, 1 + i * 0.08, Math.sin(i * 1.6) * 0.22));
      return h;
    }
    function makeMinotauro(team) {
      const h = chibi({ team, skin: '#9a6440', legs: '#7a4a2a', girth: 1.3, scale: 1.5, faceOpts: { angry: true, iris: '#d33', brow: '#3a1e0e', noNose: true } });
      const snout = mesh(sph(0.3, 20), mat('#d4a07c'), 0, -0.2, 0.5); snout.scale.set(1.3, 0.85, 0.9); h.head.add(snout);
      for (const s of [-1, 1]) h.head.add(mesh(sph(0.05, 8), mat('#3a1e0e'), s * 0.12, -0.18, 0.76));
      h.head.add(mesh(new THREE.TorusGeometry(0.1, 0.025, 8, 16), GOLD(), 0, -0.36, 0.72));
      for (const s of [-1, 1]) {
        const horn = new THREE.Group(); horn.position.set(s * 0.55, 0.4, 0); horn.rotation.z = -s * 1.0; h.head.add(horn);
        horn.add(mesh(new THREE.ConeGeometry(0.13, 0.65, 14), mat('#fff3c4', { r: 0.35 }), 0, 0.3, 0));
      }
      h.torso.add(mesh(new THREE.CylinderGeometry(0.58, 0.64, 0.3, 24), mat(TEAM[team].c), 0, 0.02, 0));
      const axe = new THREE.Group(); h.armR.userData.hand.add(axe); axe.rotation.x = Math.PI / 2.4;
      axe.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.7, 10), mat('#a0683a'), 0, 0.5, 0));
      for (const s of [-1, 1]) { const b = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.07, 24, 1, false, 0, Math.PI), STEEL(), s * 0.02, 1.2, 0); b.rotation.set(0, 0, s * Math.PI / 2); axe.add(b); }
      return h;
    }
    function makeSacerdotessa(team) {
      const h = chibi({ team, body: '#fbf7ef', faceOpts: { iris: '#2a8a5a' } });
      for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2; h.head.add(mesh(sph(0.22, 14), mat('#6b3a1c'), Math.cos(a) * 0.42, 0.4, Math.sin(a) * 0.42 - 0.1)); }
      h.head.add(mesh(sph(0.3, 16), mat('#6b3a1c'), 0, 0.6, -0.35));
      const dia = mesh(new THREE.TorusGeometry(0.6, 0.05, 8, 36, Math.PI), GOLD(), 0, 0.3, 0); dia.rotation.x = -0.3; h.head.add(dia);
      const bow = mesh(new THREE.TorusGeometry(0.6, 0.05, 8, 24, Math.PI * 1.1), GOLD()); bow.rotation.set(0, Math.PI / 2, Math.PI / 2 - 0.15); h.armL.userData.hand.add(bow);
      return h;
    }
    function makeRe(team) {
      const h = chibi({ team, girth: 1.15, faceOpts: { brow: '#e8e8e8' } });
      const beard = mesh(sph(0.48, 24), mat('#f4f4f4', { r: 0.7 }), 0, -0.32, 0.25); beard.scale.set(1, 1.1, 0.75); h.head.add(beard);
      for (const s of [-1, 1]) { const m = mesh(cap(0.08, 0.25), mat('#f4f4f4'), s * 0.16, -0.18, 0.6); m.rotation.z = s * 1.2; h.head.add(m); }
      const crown = new THREE.Group(); crown.position.y = 0.52; h.head.add(crown);
      crown.add(mesh(new THREE.CylinderGeometry(0.5, 0.46, 0.28, 24, 1, true), GOLD()));
      for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; crown.add(mesh(new THREE.ConeGeometry(0.09, 0.22, 8), GOLD(), Math.cos(a) * 0.48, 0.22, Math.sin(a) * 0.48)); crown.add(mesh(sph(0.05, 8), mat('#e03030', { r: 0.2 }), Math.cos(a) * 0.5, 0.02, Math.sin(a) * 0.5)); }
      h.torso.add(mesh(rbox(1, 1, 0.12, 0.05), mat(TEAM[team].d), 0, 0.3, -0.38));   // mantello
      const sc = new THREE.Group(); h.armR.userData.hand.add(sc);
      sc.add(mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.5, 10), GOLD(), 0, 0.3, 0));
      sc.add(mesh(sph(0.13, 14), GOLD(), 0, 1.1, 0));
      return h;
    }

    // ---------------------------------------------------------------- templi con i guardiani
    function temple(team, king) {
      const g = new THREE.Group();
      const s = king ? 1.35 : 1;
      g.add(mesh(rbox(3.6 * s, 0.45, 3.2 * s, 0.1), mat('#ece2cc'), 0, 0.22, 0));
      g.add(mesh(rbox(3.2 * s, 0.4, 2.8 * s, 0.1), mat('#f8f2e6'), 0, 0.62, 0));
      const n = king ? 4 : 3;
      for (let i = 0; i < n; i++) for (const zz of [-0.95 * s, 0.95 * s]) {
        const x = (i - (n - 1) / 2) * 0.9 * s;
        g.add(mesh(new THREE.CylinderGeometry(0.21 * s, 0.25 * s, 2 * s, 20), mat('#fffaf0', { r: 0.5 }), x, 0.82 + s, zz));
        g.add(mesh(rbox(0.6 * s, 0.16, 0.6 * s, 0.05), mat('#f1e7d3'), x, 0.9 + 2 * s, zz));
      }
      g.add(mesh(rbox(3.4 * s, 0.34, 2.8 * s, 0.08), mat(TEAM[team].c, { r: 0.45 }), 0, 1.1 + 2 * s, 0));
      const tri = new THREE.Shape(); tri.moveTo(-1.8 * s, 0); tri.lineTo(1.8 * s, 0); tri.lineTo(0, 0.95 * s); tri.closePath();
      const roofGeo = new THREE.ExtrudeGeometry(tri, { depth: 2.9 * s, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 3 });
      roofGeo.translate(0, 0, -1.45 * s);
      g.add(mesh(roofGeo, mat('#f2e8d4'), 0, 1.27 + 2 * s, 0));
      const front = mesh(new THREE.ShapeGeometry(tri), mat(TEAM[team].d), 0, 1.34 + 2 * s, 1.52 * s); front.scale.setScalar(0.72); g.add(front);
      const disc = mesh(new THREE.CylinderGeometry(0.22 * s, 0.22 * s, 0.06, 24), GOLD(), 0, 1.6 + 2 * s, 1.56 * s); disc.rotation.x = Math.PI / 2; g.add(disc);
      if (king) for (let i = -1; i <= 1; i++) g.add(mesh(new THREE.ConeGeometry(0.16, 0.5, 12), GOLD(), i * 0.45, 2.55 + 2 * s, 0));
      const guard = king ? makeRe(team) : makeSacerdotessa(team);
      guard.root.scale.setScalar(king ? 0.95 : 0.8); guard.root.position.set(0, 0.82, 1.6 * s); g.add(guard.root);
      g.userData.guard = guard;
      return g;
    }

    // ---------------------------------------------------------------- piccola battaglia
    const units = [];
    const MAKE = { oplita: makeOplita, arciere: makeArciere, ciclope: makeCiclope, minotauro: makeMinotauro };
    function spawn(kind, team, x, z) {
      const h = MAKE[kind](team);
      h.root.position.set(x, 0, z);
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.74, 32), new THREE.MeshBasicMaterial({ color: TEAM[team].c, transparent: true, opacity: 0.9 }));
      ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02; h.root.add(ring);
      scene.add(h.root);
      units.push({ ...h, kind, team, hp: kind === 'ciclope' ? 900 : kind === 'minotauro' ? 1100 : 300,
        range: kind === 'arciere' ? 5 : 1.5, speed: kind === 'ciclope' || kind === 'minotauro' ? 1.1 : 1.6,
        phase: Math.random() * 6, atk: 0, cd: 0, born: 0, dead: 0 });
    }
    function reset() {
      for (const u of units) scene.remove(u.root);
      units.length = 0;
      if (showcase) return;
      spawn('oplita', 'blue', -5.5, 6); spawn('arciere', 'blue', -4.2, 8); spawn('ciclope', 'blue', 5.5, 7); spawn('minotauro', 'red', -5.5, -6);
    }
    // vetrina: i personaggi in fila, da vicino
    const showcaseUnits = [];
    function buildShowcase() {
      const list = [makeArciere('blue'), makeOplita('blue'), makeCiclope('blue'), makeMinotauro('red'), makeRe('blue')];
      const xs = [-3.4, -1.5, 0.6, 3.0, 5.0];
      list.forEach((h, i) => { h.root.position.set(xs[i], 0, 0); h.root.scale.multiplyScalar(i === 2 || i === 3 ? 0.62 : 0.95); scene.add(h.root); showcaseUnits.push(h); });
    }

    const temples = [];
    for (const [team, king, x, z] of [['blue', 0, -5.5, 9.5], ['blue', 0, 5.5, 9.5], ['blue', 1, 0, 12.9], ['red', 0, -5.5, -9.5], ['red', 0, 5.5, -9.5], ['red', 1, 0, -12.9]]) {
      const t = temple(team, !!king); t.position.set(x, 0, z); if (team === 'red') t.rotation.y = Math.PI; scene.add(t); temples.push(t);
    }
    reset();

    let slow = false;
    document.getElementById('b-restart').onclick = reset;
    document.getElementById('b-slow').onclick = (e) => { slow = !slow; e.currentTarget.classList.toggle('on', slow); };
    document.getElementById('b-cam').onclick = (e) => {
      showcase = !showcase;
      e.currentTarget.textContent = showcase ? 'Battaglia' : 'Vetrina';
      for (const h of showcaseUnits) scene.remove(h.root);
      showcaseUnits.length = 0;
      for (const t of temples) t.visible = !showcase;
      if (showcase) buildShowcase();
      reset(); placeCamera();
    };
    placeCamera();

    function nearestFoe(u) {
      let best = null, bd = 1e9;
      for (const o of units) if (o.team !== u.team && !o.dead) { const d = o.root.position.distanceTo(u.root.position); if (d < bd) { bd = d; best = o; } }
      return [best, bd];
    }
    // camminata e respiro: muove le "ossa" del modellino
    function animate(u, walking, dt, t, seed) {
      if (walking) u.phase += dt * u.speed * 6;
      const s = Math.sin(u.phase || 0), w = walking ? 1 : 0;
      u.legL.rotation.x = s * 0.8 * w; u.legR.rotation.x = -s * 0.8 * w;
      u.armL.rotation.x = -s * 0.6 * w; u.armR.rotation.x = s * 0.6 * w;
      u.rig.position.y = Math.abs(Math.cos(u.phase || 0)) * 0.14 * w;
      u.torso.rotation.z = s * 0.08 * w;
      u.head.rotation.z = -s * 0.05 * w;
      const breath = Math.sin(t * 2.6 + seed) * 0.025 * (1 - w);
      u.torso.scale.set(1 - breath * 0.5, 1 + breath, 1);
      u.head.rotation.y = (1 - w) * Math.sin(t * 0.9 + seed) * 0.3;
    }

    const clock = new THREE.Clock();
    function tick() {
      let dt = Math.min(0.05, clock.getDelta());
      if (slow) dt *= 0.3;
      const t = clock.elapsedTime;
      for (const u of units) {
        u.born += dt;
        const p = u.root.position;
        if (u.dead) { u.dead += dt; u.rig.rotation.x = Math.max(-Math.PI / 2, -u.dead * 4); if (u.dead > 1.2) p.y -= dt * 1.5; continue; }
        if (u.born < 0.4) { p.y = Math.pow(1 - u.born / 0.4, 2) * 6; continue; } else p.y = 0;
        const [foe, d] = nearestFoe(u);
        let walking = false;
        if (foe && d > u.range) {
          const dir = foe.root.position.clone().sub(p).setY(0).normalize();
          p.addScaledVector(dir, u.speed * dt); walking = true;
          u.root.rotation.y += (Math.atan2(dir.x, dir.z) - u.root.rotation.y) * Math.min(1, dt * 8);
        } else if (!foe) {
          const gz = u.team === 'blue' ? -9.5 : 9.5;
          if (Math.abs(gz - p.z) > 2.2) { p.z += Math.sign(gz - p.z) * u.speed * dt; walking = true; u.root.rotation.y = u.team === 'blue' ? Math.PI : 0; }
        } else {
          const dir = foe.root.position.clone().sub(p);
          u.root.rotation.y = Math.atan2(dir.x, dir.z);
          u.cd -= dt;
          if (u.cd <= 0) { u.cd = 1.1; u.atk = 0.001; foe.hp -= u.kind === 'ciclope' ? 160 : u.kind === 'minotauro' ? 140 : 70; if (foe.hp <= 0) foe.dead = 0.001; }
        }
        animate(u, walking, dt, t, u.phase);
        if (u.atk > 0) {
          u.atk += dt;
          const k = u.atk / 0.45;
          if (k >= 1) u.atk = 0;
          else if (u.kind === 'arciere') { u.armL.rotation.x = -1.5; u.armR.rotation.x = -1.5 + Math.sin(k * Math.PI) * 0.6; }
          else { u.armR.rotation.x = k < 0.4 ? -2.8 * (k / 0.4) : -2.8 + (k - 0.4) / 0.6 * 3.6; u.torso.rotation.x = k > 0.4 ? Math.sin((k - 0.4) / 0.6 * Math.PI) * 0.35 : 0; }
        }
      }
      showcaseUnits.forEach((h, i) => animate(h, false, dt, t, i * 1.3));
      temples.forEach((tp, i) => animate(tp.userData.guard, false, dt, t, i * 2.1));
      for (const c of crowd) c.position.y = c.userData.y + Math.max(0, Math.sin(t * 5 + c.userData.jump)) * 0.15;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = w / h < 0.6 ? 40 : 32;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    placeCamera();
    tick();
  </script>
</body>
</html>
